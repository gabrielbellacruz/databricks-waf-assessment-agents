# Once per container start (before workers fork): run migrations and publish the
# agent wheel to the docs Volume for the agent Jobs (server/agent_wheel.py), then serve.
command:
  - sh
  - -c
  - flask --app app db upgrade && python -m server.agent_wheel && gunicorn app:app -w 4 -b 0.0.0.0:${DATABRICKS_APP_PORT:-8000}

env:
  # Lakebase endpoint path used by server.config to mint OAuth credentials.
  - name: ENDPOINT_NAME
    value: "projects/waf-assessment-app/branches/production/endpoints/primary"
  # App-owned schema. The service principal cannot write to `public`, so it
  # creates and owns this schema and all connections are pinned to it.
  - name: PGSCHEMA
    value: "waf"
  # Serving endpoint the results-level backlog agent prompts (server/backlog.py),
  # from the app's "assessment-model" resource (the bundle's assessment_model var,
  # the same model the layer agents use).
  - name: WAF_ASSESSMENT_MODEL
    valueFrom: assessment-model
  # UC Volume that stores uploaded architecture documents (server/volumes.py), as
  # "/Volumes/<catalog>/<schema>/<volume>" from the app's "docs-volume" resource.
  - name: DOCS_VOLUME_PATH
    valueFrom: docs-volume
  # The agent Jobs are not app resources (they run as this app's SP, which would
  # make the app and Jobs depend on each other): the app finds each layer's Job
  # by name, `waf-agent-<layer>` (server/agents.py). The Jobs write findings
  # straight to Lakebase (agents/waf_agents/core/store.py).
