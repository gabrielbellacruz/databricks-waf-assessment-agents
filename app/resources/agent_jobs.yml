              - "--pg-host"
              - "{{job.parameters.pg_host}}"
              - "--pg-port"
              - "{{job.parameters.pg_port}}"
              - "--pg-database"
              - "{{job.parameters.pg_database}}"
              - "--pg-user"
              - "{{job.parameters.pg_user}}"
              - "--pg-schema"
              - "{{job.parameters.pg_schema}}"
              - "--endpoint-name"
              - "{{job.parameters.endpoint_name}}"
              - "--model"
              - "{{job.parameters.model}}"
      environments: *agent_environments
      tags: *agent_tags

