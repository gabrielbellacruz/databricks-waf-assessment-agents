# Databricks Asset Bundle for the WAF Assessment tool.

bundle:
  name: waf-assessment-tool

include:
  - resources/*.yml

sync:
  include:
    - backend/static/**
    # git-ignored build output: the agent wheel the app publishes for the Jobs
    - backend/agents_dist/**

variables:
  assessment_model:
    description: >-
      Serving endpoint for the assessment LLM (agent judgment + rationale and the
      backlog). Attached to the app, which grants the app SP CAN_QUERY.
    default: databricks-claude-opus-4-8
  warehouse_id:
    description: >-
      SQL warehouse the agents run their system-table queries on. Attached to the
      app, which grants the app SP CAN_USE; the agent Jobs run as that SP.
  docs_catalog:
    description: >-
      Existing UC catalog that holds the architecture-documents Volume. The
      bundle creates the schema and Volume below inside it. Attaching the Volume
      to the app also grants the app SP USE CATALOG, which works when all account
      users already have USE CATALOG on it or the deployer has MANAGE on it.
  docs_schema:
    description: Schema (created by the bundle) for the architecture-documents Volume.
    default: waf_assessment
  docs_volume:
    description: Volume (created by the bundle) where uploaded architecture docs are stored.
    default: architecture_docs

artifacts:
  waf_agents:
    type: whl
    path: ./agents
    # `rm -f dist/*.whl` first: `uv build` doesn't clean dist/, so a stale wheel
    # from an earlier version would linger and could ship instead of the fresh
    # build (old agent code). The wheel is then copied into the app source
    # (backend/agents_dist/): the app publishes it to the docs Volume at start,
    # where the agent Jobs install it (backend/server/agent_wheel.py).
    build: sh -c "mkdir -p waf_agents/data && cp ../data/waf-data.json waf_agents/data/waf-data.json && rm -f dist/*.whl && uv build --wheel && rm -rf ../backend/agents_dist && mkdir -p ../backend/agents_dist && cp dist/*.whl ../backend/agents_dist/"

resources:
  # Lakebase. Creating the project also creates its default `production` branch
  # with a read-write `primary` endpoint, and creating a branch creates that
  # branch's `primary` endpoint - all sized by default_endpoint_settings. So
  # those aren't declared here: re-declaring them fails a fresh deploy with
  # "already exists". The app uses `production`; `dev` is an isolated branch for
  # local development (CONTRIBUTING.md).
  postgres_projects:
    waf:
      project_id: waf-assessment-app
      display_name: WAF Assessment
      pg_version: 17
      purge_on_delete: true
      default_endpoint_settings:
        autoscaling_limit_min_cu: 0.5
        autoscaling_limit_max_cu: 2

  postgres_branches:
    dev:
      parent: ${resources.postgres_projects.waf.name}
      branch_id: "dev"
      no_expiry: true
      is_protected: false

  postgres_roles:
    waf_role:
      role_id: waf-app-role
      parent: ${resources.postgres_projects.waf.name}/branches/production
      postgres_role: app_role

  postgres_databases:
    waf_db:
      database_id: waf-db
      parent: ${resources.postgres_projects.waf.name}/branches/production
      postgres_database: waf
      role: ${resources.postgres_roles.waf_role.name}

  # Storage for user-uploaded architecture documents. The backend writes files
  # here (Files API) and the layer agents read them back (SDK) as extra evidence
  # for the LLM judge. Both run as the app SP, which gets its access from the
  # app's `docs-volume` resource below - deliberately no `grants` here: bundle
  # grants are authoritative and would revoke what the app resource grants.
  # The sandbox target omits `mode: development` so names stay literal.
  schemas:
    waf_docs_schema:
      catalog_name: ${var.docs_catalog}
      name: ${var.docs_schema}
      comment: "Architecture documents uploaded to the WAF Assessment app."

  volumes:
    waf_docs_volume:
      catalog_name: ${var.docs_catalog}
      schema_name: ${resources.schemas.waf_docs_schema.name}
      name: ${var.docs_volume}
      volume_type: MANAGED
      comment: "Uploaded architecture docs, one subfolder per assessment; _agents/ holds the agent wheel."

  # The app's resources grant its auto-created service principal what it needs,
  # and backend/app.yaml reads them back via `valueFrom`. The agent Jobs are
  # deliberately NOT app resources: they run as this app's SP (run_as in
  # resources/agent_jobs.yml), so listing them here would make the app and the
  # Jobs depend on each other. Instead each Job grants the app SP CAN_MANAGE_RUN
  # and the app finds its Jobs by name (backend/server/agents.py).
  apps:
    waf_assessment:
      name: waf-assessment
      description: "Databricks Well Architected Framework assessment tool (PWA + Lakebase)"
      source_code_path: ./backend
      resources:
        - name: lakebase
          postgres:
            branch: ${resources.postgres_projects.waf.name}/branches/production
            database: ${resources.postgres_databases.waf_db.name}
            permission: CAN_CONNECT_AND_CREATE
        - name: docs-volume
          uc_securable:
            securable_full_name: ${resources.volumes.waf_docs_volume.full_name}
            securable_type: VOLUME
            permission: WRITE_VOLUME
        - name: assessment-model
          serving_endpoint:
            name: ${var.assessment_model}
            permission: CAN_QUERY
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE

targets:
  sandbox:
    # Intentionally NOT `mode: development`. Development mode force-injects a
    # "[dev <user>]" name prefix, and an empty `presets.name_prefix` is ignored
    # by the dev-mode mutator - so the agent Jobs would deploy as
    # `[dev <user>] waf-agent-*` and the app, which finds its Jobs by their
    # literal names, would never see them. This is a single shared deployment
    # (the app, Lakebase project, and catalog are already literal), so all
    # resources use literal names. Each Job pins its own run_as, and no Job is
    # scheduled.
    default: true
